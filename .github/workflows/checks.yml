name: Contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m vietspeller.cli validate data/examples/illustrative.jsonl
        env:
          PYTHONPATH: src
      - run: python -m vietspeller.cli evaluate data/examples/illustrative.jsonl --artifact data/examples/bootstrap-lexicon.json --split demo --allow-demo --output runs/ci-diagnostic.json
        env:
          PYTHONPATH: src
