[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietspeller"
version = "0.1.0"
description = "Offline Vietnamese rules baseline and reproducible spelling evaluation tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vietspeller = "vietspeller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
