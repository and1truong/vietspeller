[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietspeller"
version = "0.1.0"
description = "Research scaffold for tiny, offline Vietnamese spelling detection and correction"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vietspeller = "vietspeller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
